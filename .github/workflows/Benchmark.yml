name: Benchmark
run-name: ${{ inputs.leg && format('{0} attempt {1} for run {2}', inputs.leg, inputs.attempt, inputs.parent_run_id) || github.event.head_commit.message || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      leg:
        description: 'Single build leg to run (leave empty for a full benchmark)'
        required: false
        default: ''
      attempt:
        description: 'Attempt number of this leg'
        required: false
        default: '1'
      parent_run_id:
        description: 'Benchmark run that will merge this leg'
        required: false
        default: ''
      sha:
        description: 'Commit to benchmark'
        required: false
        default: ''
  push:
    branches:
      - stage-1-parsing-avx512-newer

jobs:
  Plan:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.plan.outputs.configs }}
      legs: ${{ steps.plan.outputs.legs }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: shell

      - name: Select build legs
        id: plan
        env:
          LEG: ${{ inputs.leg }}
        run: bash shell/plan.sh

  Dispatch-Legs:
    runs-on: ubuntu-latest
    needs: Plan
    if: inputs.leg == ''
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        leg: ${{ fromJSON(needs.Plan.outputs.legs) }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: shell

      - name: Dispatch ${{ matrix.leg }} as its own run
        env:
          GH_TOKEN: ${{ github.token }}
          LEG: ${{ matrix.leg }}
        run: bash shell/dispatch-leg.sh "$LEG" 1 "$GITHUB_RUN_ID" "$GITHUB_SHA"

  build:
    needs: Plan
    if: inputs.leg != ''
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.Plan.outputs.configs) }}

    runs-on: ${{ matrix.config.os }}
    name: Build on ${{ matrix.config.name }}

    env:
      BRANCH_NAME: ${{ matrix.config.branch_base }}-${{ inputs.parent_run_id }}-${{ inputs.attempt }}
      ATTEMPT: ${{ inputs.attempt }}

    steps:
      - name: Reject non-target CPU runners
        shell: bash
        run: |
          EXPECTED="AMD EPYC 9V45 96-Core Processor"
          if [ "$RUNNER_OS" = "Windows" ]; then
            CPU=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name")
          else
            CPU=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)
          fi
          CPU=$(echo "$CPU" | tr -d '\r' | sed 's/^ *//;s/ *$//')
          echo "CPU: $CPU"
          if [[ "$CPU" != *"$EXPECTED"* ]]; then
            echo "Landed on $CPU instead of $EXPECTED on attempt $ATTEMPT, aborting so this leg reruns on a different runner." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - name: Harden apt (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99ci-net
          [ -f /etc/apt/apt-mirrors.txt ] && echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update

      - name: Setup Clang (Linux)
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.compiler == 'clang'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          CODENAME=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME} main" | sudo tee /etc/apt/sources.list.d/llvm-snapshot.list
          sudo apt-get update
          DEV_VERSION=$(grep -h '^Package: clang-[0-9]*$' /var/lib/apt/lists/apt.llvm.org_*_Packages | grep -oP 'clang-\K[0-9]+' | sort -nu | tail -1)
          [ -n "$DEV_VERSION" ] || { echo "no clang in llvm apt lists"; exit 1; }
          sudo apt-get install -y clang-$DEV_VERSION lld-$DEV_VERSION
          test -x /usr/bin/clang++-$DEV_VERSION
          echo "CXX_BIN=/usr/bin/clang++-$DEV_VERSION" >> $GITHUB_ENV
          echo "C_BIN=/usr/bin/clang-$DEV_VERSION" >> $GITHUB_ENV

      - name: Setup GCC (Linux)
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.compiler == 'gcc'
        timeout-minutes: 10
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          DEV_VERSION=$(apt-cache search '^g\+\+-[0-9]+$' | awk '{print $1}' | sort -V | tail -n 1 | sed 's/g++-//')
          sudo apt-get install -y --no-install-recommends gcc-$DEV_VERSION g++-$DEV_VERSION
          echo "CXX_BIN=/usr/bin/g++-$DEV_VERSION" >> $GITHUB_ENV
          echo "C_BIN=/usr/bin/gcc-$DEV_VERSION" >> $GITHUB_ENV

      - name: Setup MSVC (Windows)
        if: matrix.config.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install seaborn pandas matplotlib

      - name: Configure CMake (Unix)
        if: matrix.config.compiler != 'msvc'
        run: cmake -S . -B ./Build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ env.CXX_BIN }} -DCMAKE_C_COMPILER=${{ env.C_BIN }} -DJP_CI_RUN=TRUE

      - name: Configure CMake (Windows)
        if: matrix.config.compiler == 'msvc'
        run: cmake -S . -B ./Build -DCMAKE_BUILD_TYPE=Release -DJP_CI_RUN=TRUE

      - name: Build
        working-directory: ./Build
        run: cmake --build . --config=Release -v

      - name: Install (Unix)
        if: matrix.config.compiler != 'msvc'
        run: |
          sudo cmake --install ./Build --config=Release
          sudo chmod +x "${{ github.workspace }}/install/bin/Json-Performance"

      - name: Install (Windows)
        if: matrix.config.compiler == 'msvc'
        working-directory: ./Build
        run: cmake --install . --config=Release

      - name: Run (Unix)
        id: run_unix
        if: matrix.config.compiler != 'msvc'
        working-directory: ${{ github.workspace }}/install/bin
        shell: bash
        run: |
          set +e
          sudo -E env "PATH=$PATH" ./Json-Performance
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Run (Windows)
        id: run_windows
        if: matrix.config.compiler == 'msvc'
        working-directory: ${{ github.workspace }}/install/bin
        shell: bash
        run: |
          set +e
          ./Json-Performance
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fail on nonzero exit code
        if: (steps.run_unix.outputs.exit_code || steps.run_windows.outputs.exit_code) != '0'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run_unix.outputs.exit_code || steps.run_windows.outputs.exit_code }}
        run: |
          echo "Json-Performance exited with code $EXIT_CODE on attempt $ATTEMPT, skipping branch creation and push." >&2
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" >&2 || true
          else
            lscpu | grep -E 'Model name|Flags' >&2 || true
          fi
          exit 1

      - name: Commit and push to temp branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPILER: ${{ matrix.config.compiler }}
          COMMIT_MSG: ${{ matrix.config.commit_msg }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash shell/push-leg-branch.sh

  Relaunch-Leg:
    runs-on: ubuntu-latest
    needs: build
    if: always() && inputs.leg != '' && contains(fromJSON('["failure","cancelled"]'), needs.build.result) && fromJSON(inputs.attempt) < 100
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: shell

      - name: Dispatch ${{ inputs.leg }} again on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
          LEG: ${{ inputs.leg }}
          ATTEMPT: ${{ inputs.attempt }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          SHA: ${{ inputs.sha }}
        run: bash shell/relaunch-leg.sh "$LEG" "$ATTEMPT" "$PARENT_RUN_ID" "$SHA"

  Await-Legs:
    runs-on: ubuntu-latest
    needs: Dispatch-Legs
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: shell

      - name: Wait for every leg to push its temp branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash shell/await-legs.sh

  Cancel-Legs:
    runs-on: ubuntu-latest
    needs: [Dispatch-Legs, Await-Legs]
    if: cancelled() && inputs.leg == ''
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: shell

      - name: Cancel every leg still queued or running
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash shell/cancel-legs.sh

  Delete-Failed-Attempts:
    runs-on: ubuntu-latest
    needs: Await-Legs
    if: always() && inputs.leg == '' && needs.Await-Legs.result != 'skipped'
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: shell

      - name: Delete every failed or cancelled attempt of each leg that succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash shell/delete-failed-attempts.sh

  Merge-Branches:
    runs-on: ubuntu-latest
    needs: Await-Legs
    if: always() && inputs.leg == '' && needs.Await-Legs.result != 'skipped'

    steps:
      - uses: actions/checkout@v6

      - name: Merge all temporary branches into the benchmarking branch
        if: needs.Await-Legs.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash shell/merge-branches.sh stage-1-parsing-avx512

      - name: Delete temporary branches
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash shell/delete-temp-branches.sh
